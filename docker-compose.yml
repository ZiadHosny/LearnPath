services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: learnpath
      POSTGRES_USER: learnpath
      POSTGRES_PASSWORD: learnpath
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
